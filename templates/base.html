<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MTG Collection Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-body-tertiary border-bottom">
      <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">MTG Collection Tracker</a>
        <div class="d-flex align-items-center gap-2 ms-auto">
          <a class="btn btn-outline-light btn-sm" href="{{ url_for('analytics') }}">Analytics</a>
          <form class="d-flex" method="GET" action="{{ url_for('search_page') }}">
            <input
              type="search"
              name="q"
              class="form-control me-2"
              placeholder="Search card name..."
              value="{{ request.args.get('q') or request.cookies.get('last_search') or '' }}"
              aria-label="Search cards"
            />
            <button class="btn btn-primary" type="submit">Search</button>
          </form>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="alert alert-info">
            {% for message in messages %}
              <div>{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
